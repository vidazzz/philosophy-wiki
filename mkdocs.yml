site_name: 西方哲学研读
site_description: 个人西方哲学学习研究项目，以 LLM Wiki 模式维护的双向链接知识库
site_url: https://vidazhou.github.io/philosophy-wiki/
site_author: vidazhou
repo_url: https://github.com/vidazhou/philosophy-wiki
repo_name: vidazhou/philosophy-wiki

docs_dir: wiki
site_dir: site
use_directory_urls: true
strict: false

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - en
        - zh
      separator: >-
        [\s|　、。，；：！?,.?;:!()\[\]{}<>/\\&*@#$%\^_\+=\-]+|(?<=[一-鿿])(?=[一-鿿])|(?<=[一-鿿])(?=[A-Za-z0-9])|(?<=[A-Za-z0-9])(?=[一-鿿])

hooks:
  - hooks/wikilinks.py
  - hooks/backlinks.py
  - hooks/graph.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false